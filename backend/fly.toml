# =============================================================================
# AC7 Ride — auth service on Fly.io
# -----------------------------------------------------------------------------
#   cd backend
#   fly launch --no-deploy      # first time only, creates the app
#   fly secrets set DB_PASSWORD=... JWT_SECRET=...
#   fly deploy
#
# Region lhr (London) is chosen to sit next to the Supabase project in
# eu-west-2 — every query crosses that link, so the closer the better.
# =============================================================================

app = "ac7-ride-auth"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.auth"

[env]
  PORT = "8080"
  ENVIRONMENT = "production"
  GIN_MODE = "release"

  # Supabase — session pooler, IPv4, supports prepared statements.
  # Not the direct host: that is IPv6-only.
  DB_HOST = "aws-1-eu-west-2.pooler.supabase.com"
  DB_PORT = "5432"
  DB_USER = "ac7_app.<SUPABASE_PROJECT_REF>"
  DB_NAME = "postgres"
  DB_SSLMODE = "require"

  # Small pools: the Supabase free tier allows about 60 connections in total.
  DB_MAX_CONNS = "8"
  DB_MIN_CONNS = "2"

  JWT_EXPIRATION = "24"

  # Set this to the Vercel URL once the frontend is deployed.
  CORS_ORIGINS = "https://ac7-ride.vercel.app"

  RATE_LIMIT_ENABLED = "true"
  OTEL_ENABLED = "false"
  FIREBASE_ENABLED = "false"
  PUBSUB_ENABLED = "false"

# Secrets are NOT listed here — this file is committed.
#   fly secrets set DB_PASSWORD="..." JWT_SECRET="..."

[http_service]
  internal_port = 8080
  force_https = true

  # auto_stop/auto_start keep the free allowance intact: the machine sleeps
  # when idle and wakes on the first request. min_machines_running = 0 means
  # a cold start of a second or two after a quiet period, which is a fair
  # trade for free hosting. Set it to 1 once you have real traffic.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
